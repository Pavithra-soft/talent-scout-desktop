name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Talent Scout Desktop ${{ github.ref_name }}
          releaseBody: |
            Windows 10 or 11. One setup file. No other programs to install.

            This build fixes ranking and filters. Names are read from the resume, a copied file is listed once, Java does not match JavaScript, and a missing notice period stays in the list. The minimum match score starts at 50. Spring MVC, REST, MySQL, and Oracle are recognised. Preferably counts as an extra skill. Drafts are not sent.

            1. Download the setup file below (the name ends in setup.exe).
            2. Open it. If Windows says it protected your PC, choose More info, then Run anyway. This appears because the file is not from a paid certificate.
            3. Finish the setup. It does not need an administrator password.
            4. Open Talent Scout Desktop from the Start menu.
            5. Choose a folder of resumes, paste the job, look at the ranked list, then download Excel or save an email draft. Drafts stay on this computer and are not sent.

            To remove the app, use Settings, Apps. The uninstaller asks whether to delete the saved search. The default is No.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
